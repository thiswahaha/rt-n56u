# Actions 页面显示的工作流名称；本流程编译当前仓库的 RM2100 固件。
name: Build RM2100 firmware

# 定义触发方式。
on:
  # 允许在 Actions 页面点击“Run workflow”手动运行。
  workflow_dispatch:
    # 定义运行前可填写的参数。
    inputs:
      # 功能覆盖参数：留空使用下面的默认值，填写内容则在默认值之后应用。
      feature_overrides:
        # 表单提示：只接受逗号分隔的 INCLUDE_名称=y/n 或 ENABLE_名称=y/n。
        description: '覆盖 Action 默认功能（逗号分隔，如 INCLUDE_OPENVPN=y,INCLUDE_TTYD=n）'
        # 此参数可留空，无需逐个填写未调整的功能。
        required: false
        # 使用字符串输入，以便一次设置多个现有功能开关。
        type: string

# 设置本工作流的 GITHUB_TOKEN 权限。
permissions:
  # 允许读取源码，满足检出需要；上传 Artifact 不需要仓库写入权限。
  contents: read

# 定义工作流中的任务。
jobs:
  # 编译任务的内部标识；下面所有步骤使用同一个 Runner 工作区。
  build:
    # 固定 Ubuntu 版本，减少系统依赖升级对旧版 Padavan 编译的影响。
    runs-on: ubuntu-22.04
    # 按检出、修改配置、安装依赖、下载工具链、编译、上传的顺序执行。
    steps:
      # 将触发本次运行的 rt-n56u 提交检出到 GITHUB_WORKSPACE。
      - name: Checkout rt-n56u
        # 使用 GitHub 官方 checkout Action 下载源码。
        uses: actions/checkout@v4

      # 覆盖编译选项：先设置 Action 默认值，再应用用户输入。
      # y/n 决定功能是否编入固件；编入后是否运行仍由路由器管理页面设置决定。
      # 脚本只接受 RM2100 模板已有的 INCLUDE/ENABLE 开关，不添加其他项目的模块。
      - name: Apply optional features
        # 定义本步骤运行时的环境变量。
        env:
          # 通过环境变量传入表单文本，避免将输入直接拼进 Shell 命令。
          FEATURE_OVERRIDES: ${{ inputs.feature_overrides }}
        # 在 Ubuntu 默认 Bash 中执行下面的多行命令。
        run: |
          # 创建逗号分隔的默认配置字符串；后面的 += 依次追加配置项。
          # OpenVPN：加密 VPN 客户端/服务器；当前 AP 无线中继用途默认不编入。
          default_features="INCLUDE_OPENVPN=n"
          # DOGCOM：Dr.COM 校园网等场景的上网认证客户端；普通家庭 Wi-Fi 不需要。
          default_features+=",INCLUDE_DOGCOM=n"
          # NAPT66：IPv6 到 IPv6 的地址和端口转换；AP 桥接默认不需要。
          # 关闭此项不会关闭 IPv6，本选项也不是 IPv6/IPv4 转换功能。
          default_features+=",INCLUDE_NAPT66=n"
          # VLMCSD：Windows/Office 的 KMS 激活服务模拟程序；AP 中继默认不需要。
          default_features+=",INCLUDE_VLMCSD=n"
          # XUPNPD：通过 UPnP/DLNA 提供 IPTV 等媒体内容的服务；当前用途默认不编入。
          # 关闭此项不影响普通 UPnP 端口映射，后者使用独立的 miniupnpd 功能。
          default_features+=",INCLUDE_XUPNPD=n"
          # SRELAY：SOCKS4/5 代理服务器；AP 中继转发流量无需运行此代理。
          default_features+=",INCLUDE_SRELAY=n"
          # SMBD36：选择 Samba 3.6 版本，本身不是 SMB 文件共享的总开关。
          # 当前模板 SMBD/WINS 均为 n，但 SMBD36=y 仍会额外编入 wsdd2 网络发现服务。
          # 默认设为 n 去掉这部分；若重新开启文件共享，需要一并检查 SMBD、存储等依赖。
          default_features+=",INCLUDE_SMBD36=n"
          # 第一次调用：仅在本条命令中用默认字符串覆盖 FEATURE_OVERRIDES，写入上述七项。
          # 修改对象是 Runner 检出的模板；build_firmware_modify 稍后会将它复制为 trunk/.config。
          FEATURE_OVERRIDES="$default_features" python3 .github/scripts/configure-rm2100.py trunk/configs/templates/RM2100.config
          # 第二次调用：读取 env 中的用户输入，同名项覆盖刚才的默认值，其他项保持原值。
          # 输入留空时保留第一次调用的结果；例如 INCLUDE_OPENVPN=y 可重新编入 OpenVPN。
          # 两次调用只修改本次构建工作区，不提交或推送模板变更到 GitHub 仓库。
          python3 .github/scripts/configure-rm2100.py trunk/configs/templates/RM2100.config

      # 安装 README 编译说明列出的构建工具和系统开发库。
      - name: Install build dependencies
        # 定义 apt 安装过程使用的环境变量。
        env:
          # 防止 apt 在无人值守的 Runner 上等待交互输入。
          DEBIAN_FRONTEND: noninteractive
        # 安装步骤在源码仓库根目录执行。
        run: |
          # 刷新 Ubuntu 软件包索引。
          sudo apt-get update
          # 用 Bash 数组保存软件包，便于逐项解释用途并保持参数边界。
          build_packages=(
            unzip            # 解压 ZIP 格式的源码或工具包。
            libtool-bin      # 提供 libtool 命令，供第三方组件构建共享库。
            curl             # 下载预编译工具链和构建所需文件。
            cmake            # 为使用 CMake 的组件生成构建文件。
            gperf            # 根据关键字表生成 C/C++ 哈希查找代码。
            gawk             # 执行构建脚本中的 AWK 文本处理。
            flex             # 从词法规则生成 C 源码。
            bison            # 从语法规则生成解析器源码。
            nano             # 保留仓库编译说明中的文本编辑工具依赖。
            xxd              # 将二进制数据转换为十六进制或 C 数组。
            fakeroot         # 模拟 root 文件属性，供固件构建和文件系统打包使用。
            kmod             # 提供 depmod 等工具，处理内核模块依赖。
            cpio             # 创建或解包 cpio 格式的归档文件。
            git              # 供组件构建脚本读取 Git 信息或获取源码。
            python3-docutils # 将 reStructuredText 文档转换为手册等格式。
            gettext          # 提供翻译文本的提取、编译及相关构建工具。
            automake         # 为使用 Autotools 的组件生成 Makefile.in。
            autopoint        # 为使用 gettext 的 Autotools 项目准备构建文件。
            texinfo          # 将 Texinfo 文档生成 info 手册。
            build-essential  # 提供宿主机 GCC/G++、make 及基本开发环境。
            help2man         # 根据程序的帮助输出生成 man 手册。
            pkg-config       # 查询宿主机开发库的头文件和链接参数。
            zlib1g-dev       # 提供宿主机压缩库 zlib 的开发文件。
            libgmp3-dev      # 提供 GMP 多精度整数运算库的开发文件。
            libmpc-dev       # 提供 MPC 多精度复数运算库的开发文件。
            libmpfr-dev      # 提供 MPFR 多精度浮点运算库的开发文件。
            libncurses5-dev  # 提供终端界面库的开发文件，供配置工具等使用。
            libltdl-dev      # 提供 libtool 动态加载库的开发文件。
            wget             # 供使用 wget 的组件构建脚本下载文件。
            libc-dev-bin     # 提供宿主机 C 标准库的开发辅助工具。
          )
          # -y 自动确认安装；--no-install-recommends 跳过推荐包，减少安装体积。
          # 数组展开会将每个软件包作为独立参数传给 apt-get。
          sudo apt-get install -y --no-install-recommends "${build_packages[@]}"

      # 使用本仓库提供的脚本下载与 Linux 3.4.x 源码匹配的 MIPS 工具链。
      - name: Download MIPS toolchain
        # 在工具链目录内运行，保证下载和解压的相对路径正确。
        working-directory: toolchain-mipsel
        # 执行下载并检查结果。
        run: |
          # 脚本将预编译工具链解压至 toolchain-3.4.x。
          sh dl_toolchain.sh
          # 脚本未严格检查下载失败；验证编译器存在以便尽早报错。
          test -x toolchain-3.4.x/bin/mipsel-linux-uclibc-gcc

      # 按仓库 README 的方式编译模板 configs/templates/RM2100.config。
      - name: Build RM2100 firmware
        # 构建脚本要求从 trunk 目录执行。
        working-directory: trunk
        # 编译失败或后续检查失败都会使本步骤失败。
        run: |
          # 明确检查目标机型配置，避免模板缺失时误编译其他机型。
          test -f configs/templates/RM2100.config
          # 参数 RM2100 指定目标模板；脚本会用已覆盖的模板生成 .config 并构建固件。
          # fakeroot 满足编译脚本对 root 身份的检查并保留文件权限语义。
          fakeroot ./build_firmware_modify RM2100
          # compgen 检查是否存在匹配的 .trx 固件；重定向只隐藏文件名，保留检查的退出状态。
          # 必须生成至少一个 trx 文件，才继续上传构建产物。
          compgen -G 'images/*.trx' > /dev/null
          # 列出固件大小，方便在构建日志中核对产物。
          ls -lh images/*.trx

      # 将固件和实际使用的配置作为本次运行的 Artifact 保存。
      - name: Upload RM2100 firmware
        # 使用 GitHub 官方上传 Action，在运行详情页提供产物下载。
        uses: actions/upload-artifact@v4
        # 设置上传 Action 的参数。
        with:
          # 在 Actions 页面显示机型和本次运行编号，便于区分构建。
          name: RM2100-${{ github.run_number }}
          # 多行路径依次指定固件文件和本次修改后的模板配置，便于核对构建选项。
          # 此处每行都会被解释为上传路径，因此说明写在 path 字段上方。
          path: |
            trunk/images/*.trx
            trunk/configs/templates/RM2100.config
          # 产物缺失时使上传步骤失败，避免显示空的成功构建。
          if-no-files-found: error
